[alias]
plugin = "rustc --lib --release --target x86_64-pc-windows-msvc --package yap --features plugin,hook --crate-type cdylib"
mod    = "rustc --lib --release --target x86_64-pc-windows-msvc --package yap --no-default-features --crate-type cdylib"
crate  = "rustc --lib --release --target x86_64-pc-windows-msvc --package yap --features plugin --crate-type cdylib"
