[package]
name = "yap"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "yap"

[features]
default = ["plugin", "hook"]
# detours of FTLog and RED4ext's Logger: the only part of yap built around raw pointers,
# opt out with `--no-default-features --features plugin` (`plugin` must stay on, or the DLL exports nothing)
hook = ["dep:libloading"]
plugin = []

[dependencies]
libloading = { version = "0.9", optional = true }
red4ext-rs = { git = "https://github.com/jac3km4/red4ext-rs", tag = "v0.11.0", features = ["log"] }

[build-dependencies]
semver = "1.0"
