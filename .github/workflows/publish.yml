name: Publish to Nexus Mods

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag (e.g. v0.3.0)"
        required: true
        type: string
      variants:
        description: "Which build(s) to publish"
        type: choice
        options: [both, hook, no-hook]
        default: both
      allow_prerelease:
        description: "Allow a release still marked pre-release"
        type: boolean
        default: false
      dry_run:
        description: "Run all checks but skip the upload"
        type: boolean
        default: true

permissions:
  contents: read

# Nexus "file" IDs (Files tab > Advanced, or Manage Files > edit), not secret.
# Each file must already exist with one upload: the action only adds versions to it.
env:
  NEXUS_FILE_ID_HOOK: "8117220"      # the "Yap" file
  NEXUS_FILE_ID_NO_HOOK: "8117226"   # the "Yap (NO_HOOK)" file
  # `uses:` takes no expressions, hence the YAML anchor (must be the full owner/repo@sha)
  NEXUS_ACTION_VERSION: &nexus-action Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23   # v1.0.0-beta.10

# single global lane: two tags must never race on the same Nexus files / mod version
concurrency:
  group: nexus-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.check.outputs.variants }}
      version: ${{ steps.check.outputs.version }}
      digests: ${{ steps.check.outputs.digests }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      VARIANTS: ${{ inputs.variants }}
      ALLOW_PRE: ${{ inputs.allow_prerelease }}
    steps:
      # who may publish, and from which ref, is enforced by the `nexusmods` environment
      # (required reviewers + main-only deployments), not here: this file is editable by any writer
      - id: check
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::Not a publishable tag: $TAG"; exit 1; }

          case "$VARIANTS" in
            both)          list='["hook","no-hook"]' ;;
            hook|no-hook)  list="[\"$VARIANTS\"]" ;;
            *) echo "::error::Unknown variant: $VARIANTS"; exit 1 ;;
          esac

          # drafts are not returned by this endpoint at all
          info=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG") \
            || { echo "::error::No published release for $TAG"; exit 1; }
          [[ $(jq -r .draft <<<"$info") == false ]] \
            || { echo "::error::$TAG is a draft"; exit 1; }
          if [[ $(jq -r .prerelease <<<"$info") == true && "$ALLOW_PRE" != true ]]; then
            echo "::error::$TAG is still a pre-release: promote it first, or tick allow_prerelease"; exit 1
          fi

          # never go backwards: update_mod_version + archive_existing_version would
          # downgrade the mod page and archive the newer file.
          # NB: sort -V ranks v0.3.0 before v0.3.0-rc.1 (only matters with allow_prerelease)
          highest=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/nexus/v" --jq '.[].ref' \
            | sed -E 's#^refs/tags/nexus/##; s#-(hook|no-hook)$##' | sort -uV | tail -n1)
          if [[ -n "$highest" && "$highest" != "$TAG" ]]; then
            top=$(printf '%s\n%s\n' "$highest" "$TAG" | sort -V | tail -n1)
            [[ "$top" == "$TAG" ]] \
              || { echo "::error::$TAG is older than $highest, already on Nexus"; exit 1; }
          fi

          digests='{}'
          for v in $(jq -r '.[]' <<<"$list"); do
            suffix=""; [[ $v == no-hook ]] && suffix="-NO_HOOK"
            asset="Yap-windows-${TAG}${suffix}.zip"
            digest=$(jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .digest // empty' <<<"$info")
            [[ -n "$digest" ]] \
              || { echo "::error::Missing release asset $asset (or its digest)"; exit 1; }
            digests=$(jq -c --arg v "$v" --arg d "$digest" '. + {($v): $d}' <<<"$digests")
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nexus/$TAG-$v" >/dev/null 2>&1; then
              echo "::error::$TAG ($v) was already published to Nexus"; exit 1
            fi
          done

          echo "variants=$list"    >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"
          echo "digests=$digests"  >> "$GITHUB_OUTPUT"

  upload:
    needs: validate
    runs-on: ubuntu-latest
    # dry runs need neither approval nor the API key
    environment: ${{ !inputs.dry_run && 'nexusmods' || '' }}   # holds secrets.NEXUS_API_KEY
    permissions:
      contents: write                 # only for the nexus/<tag>-<variant> marker
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ fromJSON(needs.validate.outputs.variants) }}
    # GH_TOKEN is scoped per step on purpose: the third-party upload step must not see it
    env:
      TAG: ${{ inputs.tag }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Download ${{ matrix.variant }} build
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          DIGESTS: ${{ needs.validate.outputs.digests }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            hook)    suffix="";         file_id="$NEXUS_FILE_ID_HOOK";    label="Yap" ;;
            no-hook) suffix="-NO_HOOK"; file_id="$NEXUS_FILE_ID_NO_HOOK"; label="Yap (NO_HOOK)" ;;
          esac
          [[ -n "$file_id" ]] || { echo "::error::No Nexus file ID set for $VARIANT"; exit 1; }
          asset="Yap-windows-${TAG}${suffix}.zip"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern "$asset" --dir .
          expected=$(jq -r --arg v "$VARIANT" '.[$v]' <<<"$DIGESTS")
          actual="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
          [[ "$actual" == "$expected" ]] \
            || { echo "::error::$asset changed since validation ($actual != $expected)"; exit 1; }
          echo "\`$asset\` $actual" >> "$GITHUB_STEP_SUMMARY"
          { echo "file=$asset"; echo "file_id=$file_id"; echo "label=$label"; } >> "$GITHUB_OUTPUT"

      # claimed *before* uploading: creating an existing ref fails (422), so this is an
      # atomic lock against double publishing. A failed upload leaves the claim in place.
      - name: Claim marker
        id: claim
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/nexus/$TAG-$VARIANT" -f sha="$sha" >/dev/null

      - name: Upload to Nexus Mods
        if: ${{ !inputs.dry_run }}
        uses: *nexus-action   # see NEXUS_ACTION_VERSION
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ steps.asset.outputs.file_id }}
          filename: ${{ steps.asset.outputs.file }}
          version: ${{ needs.validate.outputs.version }}
          display_name: ${{ steps.asset.outputs.label }}
          archive_existing_version: false
          update_mod_version: true

      - name: Explain how to release the claim
        if: ${{ failure() && steps.claim.outcome == 'success' }}
        run: |
          {
            echo "### Upload of $TAG ($VARIANT) failed after claiming its marker"
            echo "Check the Nexus file page first. If nothing was uploaded, release the claim and re-run:"
            echo '```sh'
            echo "gh api -X DELETE repos/$GITHUB_REPOSITORY/git/refs/tags/nexus/$TAG-$VARIANT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
