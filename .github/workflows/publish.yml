name: Publish to Nexus Mods

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag (e.g. v0.3.0)"
        required: true
        type: string
      variants:
        description: "Which build(s) to publish"
        type: choice
        options: [both, hook, no-hook]
        default: both
      allow_prerelease:
        description: "Allow a release still marked pre-release"
        type: boolean
        default: false
      dry_run:
        description: "Run all checks but skip the upload"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nexus-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor == 'Roms' && github.triggering_actor == 'Roms'
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.check.outputs.variants }}
      version: ${{ steps.check.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      VARIANTS: ${{ inputs.variants }}
      ALLOW_PRE: ${{ inputs.allow_prerelease }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::Not a publishable tag: $TAG"; exit 1; }

          case "$VARIANTS" in
            both)          list='["hook","no-hook"]' ;;
            hook|no-hook)  list="[\"$VARIANTS\"]" ;;
            *) echo "::error::Unknown variant: $VARIANTS"; exit 1 ;;
          esac

          info=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets)
          [[ $(jq -r .isDraft <<<"$info") == false ]] \
            || { echo "::error::$TAG is a draft"; exit 1; }
          if [[ $(jq -r .isPrerelease <<<"$info") == true && "$ALLOW_PRE" != true ]]; then
            echo "::error::$TAG is still a pre-release: promote it first, or tick allow_prerelease"; exit 1
          fi

          for v in $(jq -r '.[]' <<<"$list"); do
            suffix=""; [[ $v == no-hook ]] && suffix="-NO_HOOK"
            asset="Yap-windows-${TAG}${suffix}.zip"
            jq -e --arg n "$asset" '.assets | any(.name == $n)' <<<"$info" >/dev/null \
              || { echo "::error::Missing release asset $asset"; exit 1; }
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nexus/$TAG-$v" >/dev/null 2>&1; then
              echo "::error::$TAG ($v) was already published to Nexus"; exit 1
            fi
          done

          echo "variants=$list"  >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  upload:
    needs: validate
    runs-on: ubuntu-latest
    environment: nexusmods            # holds secrets.NEXUSMODS_API_KEY
    permissions:
      contents: write                 # only for the nexus/<tag>-<variant> marker
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ fromJSON(needs.validate.outputs.variants) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Download ${{ matrix.variant }} build
        id: asset
        env:
          ID_HOOK: ${{ vars.NEXUS_FILE_ID_HOOK }}
          ID_NO_HOOK: ${{ vars.NEXUS_FILE_ID_NO_HOOK }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            hook)    suffix="";         file_id="$ID_HOOK";    label="Yap" ;;
            no-hook) suffix="-NO_HOOK"; file_id="$ID_NO_HOOK"; label="Yap (NO_HOOK)" ;;
          esac
          [[ -n "$file_id" ]] || { echo "::error::No Nexus file ID set for $VARIANT"; exit 1; }
          asset="Yap-windows-${TAG}${suffix}.zip"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern "$asset" --dir .
          sha256sum "$asset" >> "$GITHUB_STEP_SUMMARY"
          { echo "file=$asset"; echo "file_id=$file_id"; echo "label=$label"; } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        if: ${{ !inputs.dry_run }}
        uses: Nexus-Mods/upload-action@<commit-sha>   # pin to a full SHA
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.asset.outputs.file_id }}
          filename: ${{ steps.asset.outputs.file }}
          version: ${{ needs.validate.outputs.version }}
          display_name: ${{ steps.asset.outputs.label }}
          archive_existing_version: true
          update_mod_version: true

      - name: Mark as published
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/nexus/$TAG-$VARIANT" -f sha="$sha"
